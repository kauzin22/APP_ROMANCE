<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#07071a" />
  <title>Cine & Dates</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: #07071a;
      color: #e8e8ff;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
    ::placeholder { color: rgba(232,232,255,0.3); }
    input:focus { outline: none; }

    /* blobs */
    .blob-wrap {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    }
    .blob {
      position: absolute; border-radius: 50%;
    }
    .blob-v { top: -15%; left: -10%; width: 55vw; height: 55vw; background: radial-gradient(circle, rgba(139,92,246,0.18) 0%, transparent 70%); }
    .blob-p { bottom: -10%; right: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(244,63,94,0.14) 0%, transparent 70%); }
    .blob-c { top: 50%; left: 40%; width: 30vw; height: 30vw; background: radial-gradient(circle, rgba(34,211,238,0.08) 0%, transparent 70%); }

    /* glass */
    .glass {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* grad text */
    .grad-text {
      background: linear-gradient(135deg, #8b5cf6, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* grad btn */
    .grad-btn {
      width: 100%; padding: 14px; border: none; border-radius: 16px;
      cursor: pointer; font-family: 'Outfit', sans-serif;
      font-size: 0.95rem; font-weight: 800; color: #fff;
      background: linear-gradient(135deg, #8b5cf6, #f43f5e);
      box-shadow: 0 6px 24px rgba(139,92,246,0.35);
      transition: opacity 0.2s, transform 0.1s;
    }
    .grad-btn:active { transform: scale(0.97); }
    .grad-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .glass-btn {
      width: 100%; padding: 13px; border-radius: 16px; cursor: pointer;
      font-family: 'Outfit', sans-serif; font-size: 0.9rem; font-weight: 700;
      color: rgba(232,232,255,0.7); background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1); transition: background 0.2s;
    }
    .glass-btn:hover { background: rgba(255,255,255,0.09); }

    /* inputs */
    .field-input {
      width: 100%; padding: 13px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; color: #e8e8ff;
      font-size: 0.92rem; font-family: 'Outfit', sans-serif;
      transition: border-color 0.2s;
    }
    .field-input:focus { border-color: #8b5cf6; }

    /* pill toggle */
    .pill-toggle {
      display: flex; background: rgba(255,255,255,0.04);
      border-radius: 14px; padding: 4px; margin-bottom: 24px; gap: 4px;
    }
    .pill-btn {
      flex: 1; padding: 9px; border-radius: 11px; border: none;
      cursor: pointer; font-family: 'Outfit', sans-serif;
      font-size: 0.85rem; font-weight: 700; transition: all 0.2s;
    }
    .pill-btn.active {
      background: linear-gradient(135deg, #8b5cf6, #f43f5e); color: #fff;
    }
    .pill-btn.inactive { background: transparent; color: rgba(232,232,255,0.45); }

    /* bottom nav */
    .bottom-nav {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      z-index: 50; display: flex;
      background: rgba(15,15,42,0.9);
      backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px; padding: 8px 10px; gap: 2px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.6);
      width: calc(100% - 32px); max-width: 440px;
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      gap: 3px; padding: 8px 4px; border-radius: 20px; border: none;
      cursor: pointer; background: transparent; transition: all 0.2s;
      font-family: 'Outfit', sans-serif;
    }
    .nav-btn.active { background: linear-gradient(135deg,rgba(139,92,246,0.3),rgba(244,63,94,0.2)); }
    .nav-btn .nav-icon { font-size: 1.1rem; line-height: 1; }
    .nav-btn .nav-label { font-size: 0.58rem; font-weight: 700; letter-spacing: 0.2px; }
    .nav-btn.active .nav-label { color: #fff; }
    .nav-btn:not(.active) .nav-label { color: rgba(232,232,255,0.45); }

    /* sidebar */
    .sidebar {
      width: 240px; flex-shrink: 0; position: sticky; top: 0;
      height: 100dvh; background: rgba(15,15,42,0.7);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid rgba(255,255,255,0.08);
      display: none; flex-direction: column; padding: 24px 16px;
    }
    .sidebar-nav-btn {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; border-radius: 14px; border: none;
      cursor: pointer; font-family: 'Outfit', sans-serif;
      font-size: 0.88rem; font-weight: 600; transition: all 0.15s;
      text-align: left; width: 100%; background: transparent;
      border-left: 3px solid transparent; color: rgba(232,232,255,0.45);
    }
    .sidebar-nav-btn.active {
      background: linear-gradient(135deg,rgba(139,92,246,0.2),rgba(244,63,94,0.15));
      color: #fff; border-left-color: #8b5cf6;
    }

    /* quiz chips */
    .chip {
      padding: 8px 14px; border-radius: 40px; cursor: pointer;
      font-family: 'Outfit', sans-serif; font-size: 0.82rem; font-weight: 600;
      transition: all 0.15s; border: 1.5px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03); color: rgba(232,232,255,0.45);
    }
    .chip.sel-v { border-color: #8b5cf6; background: rgba(139,92,246,0.13); color: #8b5cf6; transform: scale(1.04); }
    .chip.sel-p { border-color: #f43f5e; background: rgba(244,63,94,0.13); color: #f43f5e; transform: scale(1.04); }
    .chip.sel-c { border-color: #22d3ee; background: rgba(34,211,238,0.13); color: #22d3ee; transform: scale(1.04); }

    /* pref toggle cards */
    .pref-card {
      padding: 16px 14px; border-radius: 18px; cursor: pointer;
      font-family: 'Outfit', sans-serif; font-size: 0.83rem; font-weight: 600;
      display: flex; justify-content: space-between; align-items: center;
      transition: all 0.15s; border: 1.5px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03); color: rgba(232,232,255,0.45);
      width: 100%;
    }
    .pref-card.sel-v { border-color: #8b5cf6; background: rgba(139,92,246,0.13); color: #8b5cf6; }
    .pref-card.sel-p { border-color: #f43f5e; background: rgba(244,63,94,0.13); color: #f43f5e; }
    .pref-card.sel-c { border-color: #22d3ee; background: rgba(34,211,238,0.13); color: #22d3ee; }

    /* match tags */
    .match-tag-v { padding: 7px 14px; border-radius: 40px; background: rgba(139,92,246,0.13); border: 1px solid rgba(139,92,246,0.27); color: #8b5cf6; font-size: 0.82rem; font-weight: 600; }
    .match-tag-p { padding: 7px 14px; border-radius: 40px; background: rgba(244,63,94,0.13); border: 1px solid rgba(244,63,94,0.27); color: #f43f5e; font-size: 0.82rem; font-weight: 600; }
    .match-tag-c { padding: 7px 14px; border-radius: 40px; background: rgba(34,211,238,0.13); border: 1px solid rgba(34,211,238,0.27); color: #22d3ee; font-size: 0.82rem; font-weight: 600; }

    /* chat bubbles */
    .bubble-mine {
      max-width: 78%; padding: 10px 16px;
      border-radius: 18px 18px 4px 18px;
      background: linear-gradient(135deg, #8b5cf6, #f43f5e);
      font-size: 0.9rem; color: #fff; font-weight: 500; line-height: 1.5;
    }
    .bubble-theirs {
      max-width: 78%; padding: 10px 16px;
      border-radius: 18px 18px 18px 4px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.08);
      font-size: 0.9rem; color: #e8e8ff; font-weight: 500; line-height: 1.5;
    }

    /* toast */
    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 999; backdrop-filter: blur(20px); border-radius: 40px;
      padding: 10px 22px; color: #fff; font-size: 0.88rem; font-weight: 700;
      white-space: nowrap; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      animation: slideUp 0.2s ease;
    }
    .toast-ok { background: rgba(139,92,246,0.9); }
    .toast-err { background: rgba(244,63,94,0.9); }

    @keyframes slideUp {
      from { opacity:0; transform: translateX(-50%) translateY(10px); }
      to   { opacity:1; transform: translateX(-50%) translateY(0); }
    }

    /* link btn */
    .link-btn {
      background: none; border: none; cursor: pointer;
      font-family: 'Outfit', sans-serif; font-size: 0.82rem;
      color: rgba(232,232,255,0.45); text-decoration: underline; padding: 0;
    }
    .link-btn.primary { color: #8b5cf6; }

    @media (min-width: 768px) {
      .sidebar { display: flex !important; }
      .bottom-nav { display: none !important; }
      .mobile-header { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const { useState, useEffect, useRef, createElement: h } = React;
    const { createClient } = supabase;

    const sb = createClient(
      'https://wdvmxjokidsjvxapoazc.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indkdm14am9raWRzanZ4YXBvYXpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzOTQzNjQsImV4cCI6MjEwMDk3MDM2NH0.3j6TNh489JSUhItLCUJFJpTm7ImXvCjE_7-3Rc4UTxQ'
    );

    const QUIZ = {
      filmes: ['Ação / Aventura', 'Comédia Romântica', 'Terror / Suspense', 'Animes / Animação', 'Ficção Científica', 'Séries / Maratona'],
      comidas: ['Pizza 🍕', 'Japonesa / Sushi 🍣', 'Hambúrguer Artesanal 🍔', 'Massa / Italiano 🍝', 'Comida Caseira 🍲', 'Doces / Açaí 🧁'],
      dates: ['Jantar Romântico 🕯️', 'Piquenique ao Ar Livre 🌿', 'Cinema & Pipoca 🎬', 'Passeio na Praia 🌅', 'Jogar em Casa 🎮', 'Viajar no FDS ✈️'],
    };

    const TABS = [
      { id: 'match',   icon: '✦',  label: 'Match'     },
      { id: 'chat',    icon: '💬', label: 'Chat'      },
      { id: 'filmes',  icon: '🎬', label: 'Filmes'    },
      { id: 'comidas', icon: '🍕', label: 'Comidas'   },
      { id: 'dates',   icon: '✨', label: 'Dates'     },
      { id: 'conexao', icon: '🔗', label: 'Nosso Par' },
    ];

    /* ─── helpers ─── */
    function GradBtn({ onClick, disabled, children }) {
      return h('button', { className: 'grad-btn', onClick, disabled }, children);
    }
    function GlassBtn({ onClick, children }) {
      return h('button', { className: 'glass-btn', onClick }, children);
    }
    function FieldInput({ type = 'text', placeholder, value, onChange, onKeyDown }) {
      return h('input', { className: 'field-input', type, placeholder, value, onChange: e => onChange(e.target.value), onKeyDown });
    }
    function Field({ label, children }) {
      return h('div', { style: { marginBottom: 12 } },
        h('label', { style: { display: 'block', marginBottom: 5, fontSize: '0.72rem', fontWeight: 800, color: 'rgba(232,232,255,0.4)', textTransform: 'uppercase', letterSpacing: '1px' } }, label),
        children
      );
    }

    /* ─── App ─── */
    function App() {
      const [screen, setScreen] = useState('auth'); // auth | quiz | app
      const [authMode, setAuthMode] = useState('login'); // login | cadastro | esqueci

      const [email, setEmail]       = useState('');
      const [senha, setSenha]       = useState('');
      const [novaSenha, setNovaSenha] = useState('');
      const [nome, setNome]         = useState('');
      const [telefone, setTelefone] = useState('');

      const [nomeUsuario, setNomeUsuario]   = useState('');
      const [codigoCasal, setCodigoCasal]   = useState(localStorage.getItem('codigoCasal') || '');
      const [codigoInput, setCodigoInput]   = useState('');
      const [nomeParceiro, setNomeParceiro] = useState('');
      const [dadosParceiro, setDadosParceiro] = useState(null);

      const [prefFilmes,  setPrefFilmes]  = useState([]);
      const [prefComidas, setPrefComidas] = useState([]);
      const [prefDates,   setPrefDates]   = useState([]);

      const [aba, setAba] = useState('match');
      const [mensagens, setMensagens]     = useState([]);
      const [novaMensagem, setNovaMensagem] = useState('');
      const chatRef = useRef(null);

      const [loading, setLoading] = useState(false);
      const [toast, setToast]     = useState(null);

      const showToast = (text, ok = true) => {
        setToast({ text, ok });
        setTimeout(() => setToast(null), 3000);
      };

      /* ── auth ── */
      const auth = async () => {
        const em = email.trim().toLowerCase();
        if (!em) return showToast('Preencha o e-mail!', false);

        if (authMode === 'esqueci') {
          if (!novaSenha.trim()) return showToast('Digite a nova senha!', false);
          setLoading(true);
          const { data, error } = await sb.from('Usuarios').update({ senha: novaSenha.trim() }).ilike('email', em).select();
          setLoading(false);
          if (error || !data || data.length === 0) return showToast('E-mail não encontrado!', false);
          showToast('Senha alterada! Faça login.');
          setAuthMode('login'); setSenha(''); setNovaSenha('');
          return;
        }

        if (!senha.trim()) return showToast('Preencha a senha!', false);
        setLoading(true);

        if (authMode === 'cadastro') {
          if (!nome.trim()) { setLoading(false); return showToast('Digite seu nome!', false); }
          const { error } = await sb.from('Usuarios').insert([{ nome: nome.trim(), email: em, telefone, senha: senha.trim() }]);
          setLoading(false);
          if (error) return showToast('Erro: ' + error.message, false);
          setNomeUsuario(nome.trim());
          setScreen('quiz');
        } else {
          const { data, error } = await sb.from('Usuarios').select('*').ilike('email', em).eq('senha', senha.trim()).maybeSingle();
          setLoading(false);
          if (error || !data) return showToast('E-mail ou senha incorretos!', false);
          setNomeUsuario(data.nome);
          setEmail(data.email);
          if (data.preferencias) {
            try {
              const p = typeof data.preferencias === 'string' ? JSON.parse(data.preferencias) : data.preferencias;
              setPrefFilmes(p.filmes || []);
              setPrefComidas(p.comidas || []);
              setPrefDates(p.dates || []);
              setScreen('app');
            } catch(e) { setScreen('quiz'); }
          } else { setScreen('quiz'); }
        }
      };

      const salvarQuiz = async () => {
        if (!prefFilmes.length || !prefComidas.length || !prefDates.length)
          return showToast('Selecione pelo menos 1 em cada categoria!', false);
        const em = email.trim().toLowerCase();
        const prefs = { filmes: prefFilmes, comidas: prefComidas, dates: prefDates };
        const { error } = await sb.from('Usuarios').update({ preferencias: JSON.stringify(prefs) }).ilike('email', em);
        if (error) return showToast('Erro ao salvar!', false);
        setScreen('app');
        showToast('Perfil salvo! 🌟');
      };

      const salvarPrefs = async () => {
        const em = email.trim().toLowerCase();
        const prefs = { filmes: prefFilmes, comidas: prefComidas, dates: prefDates };
        await sb.from('Usuarios').update({ preferencias: JSON.stringify(prefs) }).ilike('email', em);
      };

      const toggle = (item, list, setList) => {
        if (list.includes(item)) setList(list.filter(i => i !== item));
        else setList([...list, item]);
      };

      /* ── casal ── */
      const gerarCodigo = async () => {
        const c = 'AMOR-' + Math.floor(1000 + Math.random() * 9000);
        const em = email.trim().toLowerCase();
        const { error } = await sb.from('App_Casal').insert([{ codigo_casal: c, user_1: em }]);
        if (error) return showToast('Erro ao criar código.', false);
        setCodigoCasal(c); localStorage.setItem('codigoCasal', c);
        showToast('Código ' + c + ' gerado! 🗝️');
      };

      const vincular = async () => {
        const c = codigoInput.trim().toUpperCase();
        const em = email.trim().toLowerCase();
        if (!c) return showToast('Digite o código!', false);
        const { data: casal, error } = await sb.from('App_Casal').select('*').eq('codigo_casal', c).maybeSingle();
        if (error || !casal) return showToast('Código inválido!', false);
        if (casal.user_1 !== em && !casal.user_2)
          await sb.from('App_Casal').update({ user_2: em }).eq('codigo_casal', c);
        setCodigoCasal(c); localStorage.setItem('codigoCasal', c);
        await carregarPar(c);
        showToast('Conectados! 🎉');
      };

      const carregarPar = async (cod) => {
        const em = email.trim().toLowerCase();
        const { data: casal } = await sb.from('App_Casal').select('*').eq('codigo_casal', cod).maybeSingle();
        if (!casal) return;
        const emailPar = casal.user_1 === em ? casal.user_2 : casal.user_1;
        if (!emailPar) return;
        const { data: par } = await sb.from('Usuarios').select('*').ilike('email', emailPar).maybeSingle();
        if (par) {
          setNomeParceiro(par.nome);
          if (par.preferencias) {
            try {
              const p = typeof par.preferencias === 'string' ? JSON.parse(par.preferencias) : par.preferencias;
              setDadosParceiro(p);
            } catch(e) {}
          }
        }
        carregarMensagens(cod);
      };

      const carregarMensagens = async (cod) => {
        const { data } = await sb.from('App_Mensagens').select('*').eq('codigo_casal', cod).order('created_at', { ascending: true });
        if (data) setMensagens(data);
      };

      const enviarMensagem = async () => {
        if (!novaMensagem.trim() || !codigoCasal) return;
        const texto = novaMensagem.trim(); setNovaMensagem('');
        const { error } = await sb.from('App_Mensagens').insert([{ codigo_casal: codigoCasal, remetente: email.trim().toLowerCase(), nome_remetente: nomeUsuario, mensagem: texto }]);
        if (error) showToast('Erro ao enviar!', false);
        else carregarMensagens(codigoCasal);
      };

      useEffect(() => { if (codigoCasal && email) carregarPar(codigoCasal); }, [codigoCasal, email]);

      useEffect(() => {
        if (!codigoCasal) return;
        const ch = sb.channel('rt_' + codigoCasal)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'App_Casal', filter: 'codigo_casal=eq.' + codigoCasal }, () => carregarPar(codigoCasal))
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'App_Mensagens', filter: 'codigo_casal=eq.' + codigoCasal }, (payload) => setMensagens(prev => [...prev, payload.new]))
          .subscribe();
        return () => sb.removeChannel(ch);
      }, [codigoCasal, email]);

      useEffect(() => {
        if (aba === 'chat' && chatRef.current)
          chatRef.current.scrollTop = chatRef.current.scrollHeight;
      }, [mensagens, aba]);

      const matches = (mine, theirs) => theirs ? mine.filter(x => theirs.includes(x)) : [];

      /* ─── RENDER ─── */
      return h('div', { style: { fontFamily: "'Outfit', sans-serif", minHeight: '100dvh' } },

        /* blobs */
        h('div', { className: 'blob-wrap' },
          h('div', { className: 'blob blob-v' }),
          h('div', { className: 'blob blob-p' }),
          h('div', { className: 'blob blob-c' }),
        ),

        /* toast */
        toast && h('div', { className: 'toast ' + (toast.ok ? 'toast-ok' : 'toast-err') }, toast.text),

        /* ── AUTH ── */
        screen === 'auth' && h('div', { style: { position: 'relative', zIndex: 10, minHeight: '100dvh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '24px 20px' } },
          h('div', { style: { width: '100%', maxWidth: 400 } },

            /* logo */
            h('div', { style: { textAlign: 'center', marginBottom: 36 } },
              h('div', { style: { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: 64, height: 64, borderRadius: 20, marginBottom: 16, background: 'linear-gradient(135deg,rgba(139,92,246,0.3),rgba(244,63,94,0.3))', border: '1px solid rgba(139,92,246,0.4)', fontSize: '1.8rem' } }, '🎬'),
              h('h1', { className: 'grad-text', style: { fontSize: '2.2rem', fontWeight: 900, letterSpacing: '-1px' } }, 'Cine & Dates'),
              h('p', { style: { color: 'rgba(232,232,255,0.45)', marginTop: 6, fontSize: '0.9rem' } }, 'O app do casal mais gato da cidade'),
            ),

            /* card */
            h('div', { className: 'glass', style: { borderRadius: 28, padding: '28px 24px', boxShadow: '0 24px 80px rgba(0,0,0,0.5)' } },

              /* pill toggle */
              authMode !== 'esqueci' && h('div', { className: 'pill-toggle' },
                h('button', { className: 'pill-btn ' + (authMode === 'login' ? 'active' : 'inactive'), onClick: () => setAuthMode('login') }, 'Entrar'),
                h('button', { className: 'pill-btn ' + (authMode === 'cadastro' ? 'active' : 'inactive'), onClick: () => setAuthMode('cadastro') }, 'Criar conta'),
              ),

              authMode === 'cadastro' && h(Field, { label: 'Seu nome' }, h(FieldInput, { placeholder: 'Como te chamam?', value: nome, onChange: setNome })),
              h(Field, { label: 'E-mail' }, h(FieldInput, { type: 'email', placeholder: 'seu@email.com', value: email, onChange: setEmail })),
              authMode !== 'esqueci' && h(Field, { label: 'Senha' }, h(FieldInput, { type: 'password', placeholder: '••••••••', value: senha, onChange: setSenha, onKeyDown: e => e.key === 'Enter' && auth() })),
              authMode === 'esqueci' && h(Field, { label: 'Nova senha' }, h(FieldInput, { type: 'password', placeholder: 'Nova senha', value: novaSenha, onChange: setNovaSenha, onKeyDown: e => e.key === 'Enter' && auth() })),

              h(GradBtn, { onClick: auth, disabled: loading, style: { marginTop: 8 } },
                loading ? '...' : authMode === 'login' ? 'Entrar 🚀' : authMode === 'cadastro' ? 'Criar conta & Quiz' : 'Redefinir senha'
              ),

              h('div', { style: { display: 'flex', justifyContent: authMode === 'login' ? 'space-between' : 'center', marginTop: 16 } },
                authMode === 'login' && h('button', { className: 'link-btn', onClick: () => setAuthMode('esqueci') }, 'Esqueci a senha'),
                authMode === 'esqueci' && h('button', { className: 'link-btn', onClick: () => setAuthMode('login') }, '← Voltar ao login'),
                authMode !== 'esqueci' && h('button', { className: 'link-btn primary', onClick: () => setAuthMode(authMode === 'login' ? 'cadastro' : 'login') },
                  authMode === 'login' ? 'Não tem conta? Criar' : 'Já tenho conta'
                ),
              ),
            ),
          ),
        ),

        /* ── QUIZ ── */
        screen === 'quiz' && h('div', { style: { position: 'relative', zIndex: 10, minHeight: '100dvh', overflowY: 'auto', padding: '28px 20px 40px', display: 'flex', flexDirection: 'column', alignItems: 'center' } },
          h('div', { style: { width: '100%', maxWidth: 480 } },
            h('div', { style: { textAlign: 'center', marginBottom: 28 } },
              h('div', { style: { fontSize: '2.5rem' } }, '💜'),
              h('h2', { style: { fontSize: '1.8rem', fontWeight: 900, margin: '8px 0 4px', letterSpacing: '-0.5px' } }, 'O que você curte?'),
              h('p', { style: { color: 'rgba(232,232,255,0.45)', fontSize: '0.88rem' } }, 'Selecione tudo que você gosta pra a gente dar o match!'),
            ),

            /* filmes */
            h('div', { className: 'glass', style: { borderRadius: 24, padding: 20, marginBottom: 14 } },
              h('p', { style: { margin: '0 0 12px', fontSize: '0.78rem', fontWeight: 800, textTransform: 'uppercase', letterSpacing: '1.5px', color: '#8b5cf6' } }, '🎬 Para Assistir'),
              h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 8 } },
                QUIZ.filmes.map(item => h('button', { key: item, className: 'chip ' + (prefFilmes.includes(item) ? 'sel-v' : ''), onClick: () => toggle(item, prefFilmes, setPrefFilmes) }, item))
              ),
            ),

            /* comidas */
            h('div', { className: 'glass', style: { borderRadius: 24, padding: 20, marginBottom: 14 } },
              h('p', { style: { margin: '0 0 12px', fontSize: '0.78rem', fontWeight: 800, textTransform: 'uppercase', letterSpacing: '1.5px', color: '#f43f5e' } }, '🍕 Para Comer'),
              h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 8 } },
                QUIZ.comidas.map(item => h('button', { key: item, className: 'chip ' + (prefComidas.includes(item) ? 'sel-p' : ''), onClick: () => toggle(item, prefComidas, setPrefComidas) }, item))
              ),
            ),

            /* dates */
            h('div', { className: 'glass', style: { borderRadius: 24, padding: 20, marginBottom: 20 } },
              h('p', { style: { margin: '0 0 12px', fontSize: '0.78rem', fontWeight: 800, textTransform: 'uppercase', letterSpacing: '1.5px', color: '#22d3ee' } }, '✨ Tipo de Date'),
              h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 8 } },
                QUIZ.dates.map(item => h('button', { key: item, className: 'chip ' + (prefDates.includes(item) ? 'sel-c' : ''), onClick: () => toggle(item, prefDates, setPrefDates) }, item))
              ),
            ),

            h(GradBtn, { onClick: salvarQuiz }, 'Salvar e Entrar 🔥'),
          ),
        ),

        /* ── APP ── */
        screen === 'app' && h('div', { style: { position: 'relative', zIndex: 10, display: 'flex', minHeight: '100dvh' } },

          /* sidebar desktop */
          h('aside', { className: 'sidebar' },
            h('div', { style: { display: 'flex', alignItems: 'center', gap: 10, marginBottom: 32 } },
              h('div', { style: { width: 36, height: 36, borderRadius: 12, background: 'linear-gradient(135deg,rgba(139,92,246,0.4),rgba(244,63,94,0.4))', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.1rem' } }, '🎬'),
              h('span', { className: 'grad-text', style: { fontWeight: 900, fontSize: '1.1rem', letterSpacing: '-0.5px' } }, 'Cine & Dates'),
            ),
            h('nav', { style: { display: 'flex', flexDirection: 'column', gap: 4, flex: 1 } },
              TABS.map(t => h('button', { key: t.id, className: 'sidebar-nav-btn ' + (aba === t.id ? 'active' : ''), onClick: () => setAba(t.id) },
                h('span', { style: { fontSize: '1rem' } }, t.icon), t.label
              ))
            ),
            h('div', { className: 'glass', style: { borderRadius: 16, padding: 14, marginTop: 'auto' } },
              h('p', { style: { fontWeight: 700, fontSize: '0.9rem', marginBottom: 2 } }, nomeUsuario),
              h('p', { style: { color: 'rgba(232,232,255,0.45)', fontSize: '0.75rem', marginBottom: 10 } }, codigoCasal || 'Sem par vinculado'),
              h('button', { className: 'link-btn', onClick: () => { setScreen('auth'); setEmail(''); setSenha(''); } }, 'Sair →'),
            ),
          ),

          /* main col */
          h('div', { style: { flex: 1, display: 'flex', flexDirection: 'column', minHeight: '100dvh' } },

            /* mobile header */
            h('header', { className: 'mobile-header', style: { position: 'sticky', top: 0, zIndex: 40, background: 'rgba(7,7,26,0.85)', backdropFilter: 'blur(24px)', WebkitBackdropFilter: 'blur(24px)', borderBottom: '1px solid rgba(255,255,255,0.08)', padding: '14px 20px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
              h('div', null,
                h('span', { className: 'grad-text', style: { fontWeight: 900, fontSize: '1.1rem' } }, 'Cine & Dates'),
                h('p', { style: { color: 'rgba(232,232,255,0.4)', fontSize: '0.7rem', marginTop: 1 } }, nomeUsuario + (codigoCasal ? ' · ' + codigoCasal : '')),
              ),
              h('button', { className: 'link-btn', onClick: () => { setScreen('auth'); setEmail(''); setSenha(''); } }, 'Sair'),
            ),

            /* content */
            h('main', { style: { flex: 1, overflowY: 'auto', padding: '20px 20px 100px', maxWidth: 640, width: '100%', margin: '0 auto' } },

              /* MATCH */
              aba === 'match' && h('div', null,
                /* hero */
                h('div', { style: { borderRadius: 28, padding: 24, background: 'linear-gradient(135deg,rgba(139,92,246,0.2),rgba(244,63,94,0.15))', border: '1px solid rgba(139,92,246,0.3)', marginBottom: 20, display: 'flex', alignItems: 'center', justifyContent: 'space-between' } },
                  h('div', null,
                    h('p', { style: { margin: '0 0 4px', fontSize: '0.72rem', color: 'rgba(232,232,255,0.45)', textTransform: 'uppercase', letterSpacing: '1.5px', fontWeight: 700 } }, 'Status'),
                    h('p', { style: { margin: 0, fontSize: '1.3rem', fontWeight: 900, letterSpacing: '-0.5px' } }, dadosParceiro ? nomeUsuario + ' & ' + nomeParceiro : 'Sem par conectado'),
                    dadosParceiro && h('p', { style: { margin: '4px 0 0', color: '#f43f5e', fontSize: '0.8rem', fontWeight: 600 } }, '• ao vivo'),
                  ),
                  h('div', { style: { fontSize: '2.4rem' } }, dadosParceiro ? '💞' : '🔗'),
                ),

                !dadosParceiro
                  ? h('div', { style: { textAlign: 'center', padding: '40px 20px', background: 'rgba(255,255,255,0.04)', border: '1px dashed rgba(255,255,255,0.08)', borderRadius: 24, color: 'rgba(232,232,255,0.45)', fontSize: '0.9rem', lineHeight: 1.6 } },
                      h('div', { style: { fontSize: '2rem', marginBottom: 12 } }, '👀'),
                      'Conecte-se com seu amor na aba ', h('b', { style: { color: '#e8e8ff' } }, 'Nosso Par'), ' para ver os matches!'
                    )
                  : h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16 } },
                      /* filmes match */
                      h('div', { className: 'glass', style: { borderRadius: 24, padding: 18 } },
                        h('p', { style: { margin: '0 0 12px', fontSize: '0.78rem', fontWeight: 800, textTransform: 'uppercase', letterSpacing: '1.5px', color: '#8b5cf6' } }, '🎬 O que assistir hoje?'),
                        matches(prefFilmes, dadosParceiro.filmes).length === 0
                          ? h('p', { style: { color: 'rgba(232,232,255,0.45)', fontSize: '0.83rem', margin: 0 } }, 'Nenhum match ainda!')
                          : h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 8 } }, matches(prefFilmes, dadosParceiro.filmes).map(x => h('span', { key: x, className: 'match-tag-v' }, '✓ ' + x)))
                      ),
                      /* comidas match */
                      h('div', { className: 'glass', style: { borderRadius: 24, padding: 18 } },
                        h('p', { style: { margin: '0 0 12px', fontSize: '0.78rem', fontWeight: 800, textTransform: 'uppercase', letterSpacing: '1.5px', color: '#f43f5e' } }, '🍕 O que pedir pra comer?'),
                        matches(prefComidas, dadosParceiro.comidas).length === 0
                          ? h('p', { style: { color: 'rgba(232,232,255,0.45)', fontSize: '0.83rem', margin: 0 } }, 'Nenhum match ainda!')
                          : h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 8 } }, matches(prefComidas, dadosParceiro.comidas).map(x => h('span', { key: x, className: 'match-tag-p' }, '✓ ' + x)))
                      ),
                      /* dates match */
                      h('div', { className: 'glass', style: { borderRadius: 24, padding: 18 } },
                        h('p', { style: { margin: '0 0 12px', fontSize: '0.78rem', fontWeight: 800, textTransform: 'uppercase', letterSpacing: '1.5px', color: '#22d3ee' } }, '✨ Próximo date juntos'),
                        matches(prefDates, dadosParceiro.dates).length === 0
                          ? h('p', { style: { color: 'rgba(232,232,255,0.45)', fontSize: '0.83rem', margin: 0 } }, 'Nenhum match ainda!')
                          : h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 8 } }, matches(prefDates, dadosParceiro.dates).map(x => h('span', { key: x, className: 'match-tag-c' }, '✓ ' + x)))
                      ),
                    ),
              ),

              /* CHAT */
              aba === 'chat' && h('div', { style: { display: 'flex', flexDirection: 'column', height: '72dvh' } },
                h('div', { style: { marginBottom: 12, display: 'flex', alignItems: 'center', gap: 10 } },
                  h('div', { style: { width: 36, height: 36, borderRadius: 12, background: 'linear-gradient(135deg,#8b5cf6,#f43f5e)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1rem' } }, '💬'),
                  h('div', null,
                    h('p', { style: { margin: 0, fontWeight: 800, fontSize: '1rem' } }, 'Recadinhos'),
                    h('p', { style: { margin: 0, color: 'rgba(232,232,255,0.45)', fontSize: '0.73rem' } }, nomeParceiro ? 'com ' + nomeParceiro : 'conecte-se com seu par primeiro'),
                  ),
                ),
                h('div', { ref: chatRef, style: { flex: 1, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 8, paddingBottom: 8 } },
                  !codigoCasal
                    ? h('div', { style: { textAlign: 'center', color: 'rgba(232,232,255,0.45)', padding: '40px 20px', fontSize: '0.88rem' } }, '🔗 Conecte-se na aba Nosso Par para conversar!')
                    : mensagens.length === 0
                    ? h('div', { style: { textAlign: 'center', color: 'rgba(232,232,255,0.45)', padding: '40px 20px', fontSize: '0.88rem' } }, '😊 Sem mensagens ainda. Manda um oi pro seu amor!')
                    : mensagens.map((m, i) => {
                        const mine = m.remetente === email.trim().toLowerCase();
                        return h('div', { key: i, style: { display: 'flex', flexDirection: 'column', alignItems: mine ? 'flex-end' : 'flex-start' } },
                          h('span', { style: { fontSize: '0.68rem', color: 'rgba(232,232,255,0.4)', marginBottom: 3, paddingLeft: 4, paddingRight: 4 } }, m.nome_remetente),
                          h('div', { className: mine ? 'bubble-mine' : 'bubble-theirs' }, m.mensagem),
                        );
                      })
                ),
                codigoCasal && h('div', { style: { display: 'flex', gap: 8, marginTop: 10 } },
                  h('input', { style: { flex: 1, padding: '13px 16px', background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: 16, color: '#e8e8ff', fontSize: '0.9rem', fontFamily: "'Outfit', sans-serif" }, placeholder: 'Escreve algo, amor...', value: novaMensagem, onChange: e => setNovaMensagem(e.target.value), onKeyDown: e => e.key === 'Enter' && enviarMensagem() }),
                  h('button', { onClick: enviarMensagem, style: { width: 50, height: 50, borderRadius: 14, border: 'none', cursor: 'pointer', flexShrink: 0, background: 'linear-gradient(135deg,#8b5cf6,#f43f5e)', fontSize: '1.2rem', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 4px 16px rgba(139,92,246,0.4)' } }, '➤'),
                ),
              ),

              /* FILMES */
              aba === 'filmes' && h('div', null,
                h('h2', { style: { fontSize: '1.5rem', fontWeight: 900, margin: '0 0 6px', letterSpacing: '-0.5px' } }, '🎬 Para Assistir'),
                h('p', { style: { color: 'rgba(232,232,255,0.45)', fontSize: '0.83rem', margin: '0 0 20px' } }, 'Suas preferências • toque para mudar'),
                h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 } },
                  QUIZ.filmes.map(item => h('button', { key: item, className: 'pref-card ' + (prefFilmes.includes(item) ? 'sel-v' : ''), onClick: () => { toggle(item, prefFilmes, list => { setPrefFilmes(list); sb.from('Usuarios').update({ preferencias: JSON.stringify({ filmes: list, comidas: prefComidas, dates: prefDates }) }).ilike('email', email.trim().toLowerCase()); }); } },
                    h('span', null, item), h('span', null, prefFilmes.includes(item) ? '✓' : '+')
                  ))
                ),
              ),

              /* COMIDAS */
              aba === 'comidas' && h('div', null,
                h('h2', { style: { fontSize: '1.5rem', fontWeight: 900, margin: '0 0 6px', letterSpacing: '-0.5px' } }, '🍕 Para Comer'),
                h('p', { style: { color: 'rgba(232,232,255,0.45)', fontSize: '0.83rem', margin: '0 0 20px' } }, 'Suas preferências • toque para mudar'),
                h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 } },
                  QUIZ.comidas.map(item => h('button', { key: item, className: 'pref-card ' + (prefComidas.includes(item) ? 'sel-p' : ''), onClick: () => { toggle(item, prefComidas, list => { setPrefComidas(list); sb.from('Usuarios').update({ preferencias: JSON.stringify({ filmes: prefFilmes, comidas: list, dates: prefDates }) }).ilike('email', email.trim().toLowerCase()); }); } },
                    h('span', null, item), h('span', null, prefComidas.includes(item) ? '✓' : '+')
                  ))
                ),
              ),

              /* DATES */
              aba === 'dates' && h('div', null,
                h('h2', { style: { fontSize: '1.5rem', fontWeight: 900, margin: '0 0 6px', letterSpacing: '-0.5px' } }, '✨ Tipo de Date'),
                h('p', { style: { color: 'rgba(232,232,255,0.45)', fontSize: '0.83rem', margin: '0 0 20px' } }, 'Suas preferências • toque para mudar'),
                h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 } },
                  QUIZ.dates.map(item => h('button', { key: item, className: 'pref-card ' + (prefDates.includes(item) ? 'sel-c' : ''), onClick: () => { toggle(item, prefDates, list => { setPrefDates(list); sb.from('Usuarios').update({ preferencias: JSON.stringify({ filmes: prefFilmes, comidas: prefComidas, dates: list }) }).ilike('email', email.trim().toLowerCase()); }); } },
                    h('span', null, item), h('span', null, prefDates.includes(item) ? '✓' : '+')
                  ))
                ),
              ),

              /* NOSSO PAR */
              aba === 'conexao' && h('div', { style: { display: 'flex', flexDirection: 'column', gap: 14 } },
                /* código */
                h('div', { style: { background: 'linear-gradient(135deg,rgba(139,92,246,0.15),rgba(244,63,94,0.1))', border: '1px solid rgba(139,92,246,0.3)', borderRadius: 28, padding: 24, textAlign: 'center' } },
                  h('p', { style: { margin: '0 0 8px', fontSize: '0.72rem', color: 'rgba(232,232,255,0.45)', textTransform: 'uppercase', letterSpacing: '2px', fontWeight: 700 } }, 'Sua Chave'),
                  h('p', { style: { margin: '0 0 20px', fontSize: '2.2rem', fontWeight: 900, letterSpacing: '6px', color: '#8b5cf6' } }, codigoCasal || '· · · ·'),
                  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 8 } },
                    h(GradBtn, { onClick: gerarCodigo }, 'Gerar código novo 🗝️'),
                    h(GlassBtn, { onClick: () => { if (!codigoCasal) return showToast('Gere um código primeiro!', false); window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent('💜 Oi amor! Usa meu código *' + codigoCasal + '* no Cine & Dates!'), '_blank'); } }, 'Enviar pelo WhatsApp 📲'),
                  ),
                ),

                h('div', { style: { textAlign: 'center', color: 'rgba(232,232,255,0.25)', fontSize: '0.75rem', letterSpacing: '3px' } }, '— OU —'),

                h('div', { className: 'glass', style: { borderRadius: 24, padding: 20 } },
                  h('p', { style: { margin: '0 0 12px', fontSize: '0.8rem', fontWeight: 700, color: 'rgba(232,232,255,0.45)' } }, 'Código do seu amor:'),
                  h('div', { style: { display: 'flex', gap: 8 } },
                    h('input', { style: { flex: 1, padding: '13px 16px', background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: 14, color: '#e8e8ff', fontSize: '0.9rem', fontFamily: "'Outfit',sans-serif" }, placeholder: 'AMOR-0000', value: codigoInput, onChange: e => setCodigoInput(e.target.value), onKeyDown: e => e.key === 'Enter' && vincular() }),
                    h('button', { onClick: vincular, style: { padding: '0 20px', background: 'linear-gradient(135deg,#8b5cf6,#f43f5e)', border: 'none', borderRadius: 14, color: '#fff', fontWeight: 700, cursor: 'pointer', fontFamily: "'Outfit',sans-serif", fontSize: '0.88rem', boxShadow: '0 4px 16px rgba(139,92,246,0.35)' } }, 'Vincular'),
                  ),
                ),

                nomeParceiro && h('div', { style: { background: 'rgba(244,63,94,0.1)', border: '1px solid rgba(244,63,94,0.3)', borderRadius: 18, padding: '14px 18px', display: 'flex', alignItems: 'center', gap: 10 } },
                  h('span', { style: { fontSize: '1.3rem' } }, '💞'),
                  h('p', { style: { margin: 0, fontSize: '0.88rem', fontWeight: 600 } }, 'Conectado com ', h('span', { style: { color: '#f43f5e' } }, nomeParceiro)),
                ),
              ),
            ),

            /* bottom nav */
            h('nav', { className: 'bottom-nav' },
              TABS.map(t => h('button', { key: t.id, className: 'nav-btn ' + (aba === t.id ? 'active' : ''), onClick: () => setAba(t.id) },
                h('span', { className: 'nav-icon' }, t.icon),
                h('span', { className: 'nav-label' }, t.label),
              ))
            ),
          ),
        ),
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
