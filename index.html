<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App do Casal</title>
  
  <!-- Material Icons & Google Fonts -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React, ReactDOM, Babel e Supabase -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createClient } = supabase;

    // Supabase Client Config
    const supabaseClient = createClient(
      'https://wdvmxjokidsjvxapoazc.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInRefiI6Indkdm14am9raWRzanZ4YXBvYXpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzOTQzNjQsImV4cCI6MjEwMDk3MDM2NH0.3j6TNh489JSUhItLCUJFJpTm7ImXvCjE_7-3Rc4UTxQ'
    );

    const QUIZ_OPTIONS = {
      filmes: ['Ação / Aventura', 'Comédia Romântica', 'Terror / Suspense', 'Animes / Animação', 'Ficção Científica', 'Séries / Maratona'],
      comidas: ['Pizza Gourmet', 'Japonesa / Sushi', 'Hambúrguer Artesanal', 'Massa Italianas', 'Comida Caseira', 'Doces & Sobremesas'],
      dates: ['Jantar à Luz de Velas', 'Piquenique ao Pôr do Sol', 'Cinema Privado & Pipoca', 'Passeio na Praia', 'Gaming Night em Casa', 'Viagem de Fim de Semana']
    };

    const HUMORES = [
      { id: 'romantico', label: 'Romântico(a)', icon: 'favorite', desc: 'Quer um dengo e clima aconchegante', rec: 'Filme romântico + Vinho e Massa' },
      { id: 'cansado', label: 'Cansado(a)', icon: 'bedtime', desc: 'Precisa relaxar sem pensar muito', rec: 'Delivery de Hambúrguer + Série Leve' },
      { id: 'animado', label: 'Animado(a)', icon: 'bolt', desc: 'Pronto(a) para curtir e sair', rec: 'Jantar fora ou noite de jogos em dupla' },
      { id: 'estressado', label: 'Estressado(a)', icon: 'sentiment_extremely_dissatisfied', desc: 'Precisa descontrair e esvaziar a cabeça', rec: 'Maratona de Comédia + Doce favorito' },
      { id: 'fome', label: 'Com Fome de Leão', icon: 'restaurant', desc: 'A prioridade número 1 é comer bem', rec: 'Rodízio de Sushi ou Pizza Caprichada' }
    ];

    const TABS = [
      { id: 'match', icon: 'movie', label: 'Match' },
      { id: 'humor', icon: 'mood', label: 'Vibe & Humor' },
      { id: 'filmes', icon: 'local_movies', label: 'Filmes' },
      { id: 'comidas', icon: 'local_pizza', label: 'Comidas' },
      { id: 'dates', icon: 'auto_awesome', label: 'Dates' },
      { id: 'conexao', icon: 'favorite', label: 'Nosso Par' }
    ];

    function App() {
      const [modoLogin, setModoLogin] = useState(true);
      const [logado, setLogado] = useState(false);
      const [emQuiz, setEmQuiz] = useState(false);
      
      const [nomeUsuario, setNomeUsuario] = useState('');
      const [codigoCasal, setCodigoCasal] = useState(localStorage.getItem('codigoCasal') || '');
      const [aba, setAba] = useState('match');

      const [email, setEmail] = useState('');
      const [senha, setSenha] = useState('');
      const [nome, setNome] = useState('');
      const [telefone, setTelefone] = useState('');
      const [codigoInput, setCodigoInput] = useState('');

      const [prefFilmes, setPrefFilmes] = useState([]);
      const [prefComidas, setPrefComidas] = useState([]);
      const [prefDates, setPrefDates] = useState([]);

      // Estados de Humor e Parceiro
      const [meuHumor, setMeuHumor] = useState(localStorage.getItem('meuHumor') || 'romantico');
      const [humorParceiro, setHumorParceiro] = useState(null);
      const [dadosParceiro, setDadosParceiro] = useState(null);

      const [dadosCasal, setDadosCasal] = useState(null);
      const [loading, setLoading] = useState(false);
      const [toast, setToast] = useState(null);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const auth = async () => {
        if (!email || !senha) return showToast('Preencha e-mail e senha!');
        setLoading(true);
        try {
          if (!modoLogin) {
            if (!nome) return showToast('Digite seu nome!');
            const { error } = await supabaseClient.from('Usuarios').insert([{ nome, email, telefone, senha, humor: meuHumor }]);
            if (error) { showToast(`Erro: ${error.message}`); return; }
            setNomeUsuario(nome);
            setEmQuiz(true);
          } else {
            const { data, error } = await supabaseClient.from('Usuarios').select('*').eq('email', email).eq('senha', senha).maybeSingle();
            if (error || !data) { showToast('E-mail ou senha incorretos!'); return; }
            setNomeUsuario(data.nome);
            if (data.humor) setMeuHumor(data.humor);
            
            if (data.preferencias) {
              const prefs = JSON.parse(data.preferencias);
              setPrefFilmes(prefs.filmes || []);
              setPrefComidas(prefs.comidas || []);
              setPrefDates(prefs.dates || []);
              setLogado(true);
            } else {
              setEmQuiz(true);
            }
          }
        } finally {
          setLoading(false);
        }
      };

      const salvarQuiz = async () => {
        if (prefFilmes.length === 0 || prefComidas.length === 0 || prefDates.length === 0) {
          return showToast('Selecione pelo menos 1 opção em cada categoria!');
        }
        const minhasPrefs = { filmes: prefFilmes, comidas: prefComidas, dates: prefDates };
        await supabaseClient.from('Usuarios').update({ preferencias: JSON.stringify(minhasPrefs) }).eq('email', email);
        
        setEmQuiz(false);
        setLogado(true);
        showToast('Suas preferências foram salvas! 🌟');
      };

      const atualizarMeuHumor = async (humorId) => {
        setMeuHumor(humorId);
        localStorage.setItem('meuHumor', humorId);
        if (email) {
          await supabaseClient.from('Usuarios').update({ humor: humorId }).eq('email', email);
        }
        showToast('Sua Vibe/Humor foi atualizada! ✨');
      };

      const toggleSelection = (item, list, setList) => {
        if (list.includes(item)) setList(list.filter(i => i !== item));
        else setList([...list, item]);
      };

      // VINCULAR CÓDIGO CORRIGIDO
      const vincular = async () => {
        const c = codigoInput.trim().toUpperCase();
        if (!c) return showToast('Digite o código!');

        setLoading(true);
        try {
          let { data: casal } = await supabaseClient
            .from('App_Casal')
            .select('*')
            .eq('codigo_casal', c)
            .maybeSingle();

          if (!casal) {
            const { data: novoCasal, error: errCriar } = await supabaseClient
              .from('App_Casal')
              .insert([{ codigo_casal: c, user_1: email }])
              .select()
              .single();
              
            if (errCriar) { showToast('Erro ao criar sala do casal!'); return; }
            casal = novoCasal;
          } else if (!casal.user_2 && casal.user_1 !== email) {
            await supabaseClient
              .from('App_Casal')
              .update({ user_2: email })
              .eq('codigo_casal', c);
          }

          setCodigoCasal(c);
          localStorage.setItem('codigoCasal', c);
          await carregarDadosCasal(c);
          showToast(`Conectado ao par ${c}! ✨`);
        } finally {
          setLoading(false);
        }
      };

      // CARREGAR DADOS DO CASAL CORRIGIDO
      const carregarDadosCasal = async (codigo) => {
        if (!codigo) return;

        const { data: casal } = await supabaseClient
          .from('App_Casal')
          .select('*')
          .eq('codigo_casal', codigo)
          .maybeSingle();

        if (casal) {
          setDadosCasal(casal);
          const emailParceiro = (casal.user_1 === email) ? casal.user_2 : casal.user_1;

          if (emailParceiro) {
            const { data: usuarioParceiro } = await supabaseClient
              .from('Usuarios')
              .select('*')
              .eq('email', emailParceiro)
              .maybeSingle();

            if (usuarioParceiro) {
              setDadosParceiro(usuarioParceiro);
              setHumorParceiro(usuarioParceiro.humor);
            }
          }
        }
      };

      // TEMPO REAL (REALTIME)
      useEffect(() => {
        if (!codigoCasal) return;

        carregarDadosCasal(codigoCasal);

        const canal = supabaseClient
          .channel('mudancas-casal')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'Usuarios' }, () => {
            carregarDadosCasal(codigoCasal);
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'App_Casal' }, () => {
            carregarDadosCasal(codigoCasal);
          })
          .subscribe();

        return () => {
          supabaseClient.removeChannel(canal);
        };
      }, [codigoCasal, email]);

      const humorAtualObj = HUMORES.find(h => h.id === meuHumor) || HUMORES[0];
      const humorParceiroObj = HUMORES.find(h => h.id === humorParceiro);

      // --- TELAS ---

      // 1. Tela de Auth (Login / Cadastro)
      if (!logado && !emQuiz) {
        return (
          <div class="max-w-md mx-auto p-6 mt-10 bg-slate-800 rounded-3xl border border-slate-700 shadow-2xl">
            {toast && <div class="bg-pink-600 text-white p-3 rounded-xl mb-4 text-center font-bold text-sm animate-bounce">{toast}</div>}
            
            <div class="text-center mb-8">
              <span class="material-icons text-pink-500 text-5xl">favorite</span>
              <h1 class="text-2xl font-black text-white mt-2">LoveSync</h1>
              <p class="text-slate-400 text-sm">{modoLogin ? 'Acesse sua conta' : 'Crie sua conta para começar'}</p>
            </div>

            <div class="space-y-4">
              {!modoLogin && (
                <>
                  <input type="text" placeholder="Seu Nome" value={nome} onChange={e => setNome(e.target.value)} class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-pink-500" />
                  <input type="tel" placeholder="Seu Telefone" value={telefone} onChange={e => setTelefone(e.target.value)} class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-pink-500" />
                </>
              )}
              <input type="email" placeholder="E-mail" value={email} onChange={e => setEmail(e.target.value)} class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-pink-500" />
              <input type="password" placeholder="Senha" value={senha} onChange={e => setSenha(e.target.value)} class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-pink-500" />

              <button onClick={auth} disabled={loading} class="w-full bg-gradient-to-r from-pink-500 to-rose-500 p-3 rounded-xl font-bold text-white shadow-lg shadow-pink-500/20 active:scale-95 transition">
                {loading ? 'Carregando...' : (modoLogin ? 'Entrar' : 'Cadastrar')}
              </button>
            </div>

            <p class="text-center text-sm text-slate-400 mt-6 cursor-pointer hover:text-white" onClick={() => setModoLogin(!modoLogin)}>
              {modoLogin ? 'Não tem conta? Cadastre-se' : 'Já tem conta? Faça Login'}
            </p>
          </div>
        );
      }

      // 2. Tela de Quiz de Preferências
      if (emQuiz) {
        return (
          <div class="max-w-lg mx-auto p-6 bg-slate-800 rounded-3xl border border-slate-700 my-6 shadow-2xl">
            {toast && <div class="bg-pink-600 text-white p-3 rounded-xl mb-4 text-center font-bold text-sm">{toast}</div>}
            
            <h2 class="text-xl font-bold text-white mb-2">Suas Preferências ✨</h2>
            <p class="text-slate-400 text-sm mb-6">Escolha o que você gosta para calcularmos o Match perfeito!</p>

            {/* Filmes */}
            <div class="mb-6">
              <h3 class="text-pink-400 font-bold mb-2 flex items-center gap-2"><span class="material-icons">movie</span> Filmes & Séries</h3>
              <div class="grid grid-cols-2 gap-2">
                {QUIZ_OPTIONS.filmes.map(item => (
                  <button key={item} onClick={() => toggleSelection(item, prefFilmes, setPrefFilmes)} class={`p-3 rounded-xl text-xs font-semibold text-left border transition ${prefFilmes.includes(item) ? 'bg-pink-500/20 border-pink-500 text-pink-300' : 'bg-slate-900 border-slate-700 text-slate-400'}`}>
                    {item}
                  </button>
                ))}
              </div>
            </div>

            {/* Comidas */}
            <div class="mb-6">
              <h3 class="text-pink-400 font-bold mb-2 flex items-center gap-2"><span class="material-icons">restaurant</span> Comidas</h3>
              <div class="grid grid-cols-2 gap-2">
                {QUIZ_OPTIONS.comidas.map(item => (
                  <button key={item} onClick={() => toggleSelection(item, prefComidas, setPrefComidas)} class={`p-3 rounded-xl text-xs font-semibold text-left border transition ${prefComidas.includes(item) ? 'bg-pink-500/20 border-pink-500 text-pink-300' : 'bg-slate-900 border-slate-700 text-slate-400'}`}>
                    {item}
                  </button>
                ))}
              </div>
            </div>

            {/* Dates */}
            <div class="mb-6">
              <h3 class="text-pink-400 font-bold mb-2 flex items-center gap-2"><span class="material-icons">auto_awesome</span> Encontros / Dates</h3>
              <div class="grid grid-cols-2 gap-2">
                {QUIZ_OPTIONS.dates.map(item => (
                  <button key={item} onClick={() => toggleSelection(item, prefDates, setPrefDates)} class={`p-3 rounded-xl text-xs font-semibold text-left border transition ${prefDates.includes(item) ? 'bg-pink-500/20 border-pink-500 text-pink-300' : 'bg-slate-900 border-slate-700 text-slate-400'}`}>
                    {item}
                  </button>
                ))}
              </div>
            </div>

            <button onClick={salvarQuiz} class="w-full bg-pink-500 p-4 rounded-xl font-bold text-white shadow-lg shadow-pink-500/30">
              Salvar e Continuar ✨
            </button>
          </div>
        );
      }

      // 3. Aplicação Principal (Logado)
      return (
        <div class="max-w-md mx-auto p-4">
          {toast && <div class="fixed top-4 left-1/2 -translate-x-1/2 bg-pink-600 text-white px-6 py-3 rounded-full text-center font-bold text-sm shadow-xl z-50 animate-bounce">{toast}</div>}

          {/* Topbar */}
          <div class="flex justify-between items-center mb-6 pt-2">
            <div>
              <h1 class="text-xl font-black text-white flex items-center gap-1">Olá, {nomeUsuario} <span class="text-pink-500">♥</span></h1>
              <p class="text-xs text-slate-400">{codigoCasal ? `Parceiro conectado (${codigoCasal})` : 'Aguardando vínculo'}</p>
            </div>
            <button onClick={() => { setLogado(false); localStorage.removeItem('codigoCasal'); }} class="p-2 bg-slate-800 rounded-full text-slate-400 hover:text-rose-400">
              <span class="material-icons">logout</span>
            </button>
          </div>

          {/* CONTEÚDO DAS ABAS */}

          {/* ABA 1: MATCH */}
          {aba === 'match' && (
            <div class="space-y-4">
              <div class="bg-gradient-to-br from-pink-600 to-rose-700 p-6 rounded-3xl shadow-xl text-white">
                <span class="text-xs font-bold uppercase tracking-wider text-pink-200">Recomendação do dia</span>
                <h2 class="text-2xl font-black mt-1">{humorAtualObj.rec}</h2>
                <p class="text-xs text-pink-100 mt-2">Baseado no seu humor atual: <b>{humorAtualObj.label}</b></p>
              </div>

              {dadosParceiro ? (
                <div class="bg-slate-800 p-5 rounded-3xl border border-slate-700">
                  <h3 class="text-sm font-bold text-slate-300 mb-3 flex items-center gap-2">
                    <span class="material-icons text-pink-400">favorite</span> Status do Seu Amor ({dadosParceiro.nome})
                  </h3>
                  <div class="bg-slate-900 p-4 rounded-2xl flex items-center gap-4">
                    <span class="material-icons text-3xl text-pink-400">{humorParceiroObj?.icon || 'mood'}</span>
                    <div>
                      <div class="font-bold text-white">{humorParceiroObj?.label || 'Não informado'}</div>
                      <div class="text-xs text-slate-400">{humorParceiroObj?.desc || 'Seu parceiro ainda não definiu o humor hoje.'}</div>
                    </div>
                  </div>
                </div>
              ) : (
                <div class="bg-slate-800/50 p-6 rounded-3xl border border-dashed border-slate-700 text-center">
                  <p class="text-sm text-slate-400">Você ainda não conectou seu código ao seu parceiro.</p>
                  <button onClick={() => setAba('conexao')} class="mt-3 text-xs bg-pink-500/20 text-pink-300 border border-pink-500/30 px-4 py-2 rounded-xl font-bold">Vincular Agora</button>
                </div>
              )}
            </div>
          )}

          {/* ABA 2: VIBE & HUMOR */}
          {aba === 'humor' && (
            <div class="space-y-3">
              <h2 class="text-lg font-bold text-white mb-2">Como você está hoje?</h2>
              {HUMORES.map(h => (
                <div key={h.id} onClick={() => atualizarMeuHumor(h.id)} class={`p-4 rounded-2xl border cursor-pointer flex items-center justify-between transition ${meuHumor === h.id ? 'bg-pink-500/20 border-pink-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-750'}`}>
                  <div class="flex items-center gap-3">
                    <span class={`material-icons text-2xl ${meuHumor === h.id ? 'text-pink-400' : 'text-slate-500'}`}>{h.icon}</span>
                    <div>
                      <div class="font-bold text-sm">{h.label}</div>
                      <div class="text-xs opacity-70">{h.desc}</div>
                    </div>
                  </div>
                  {meuHumor === h.id && <span class="material-icons text-pink-500">check_circle</span>}
                </div>
              ))}
            </div>
          )}

          {/* ABAS 3, 4, 5: LISTAS DE PREFERÊNCIAS */}
          {['filmes', 'comidas', 'dates'].includes(aba) && (
            <div class="space-y-3">
              <h2 class="text-lg font-bold text-white capitalize mb-2">{aba} Favoritos</h2>
              {QUIZ_OPTIONS[aba].map(item => {
                const list = aba === 'filmes' ? prefFilmes : aba === 'comidas' ? prefComidas : prefDates;
                const setList = aba === 'filmes' ? setPrefFilmes : aba === 'comidas' ? setPrefComidas : setPrefDates;
                const isSelected = list.includes(item);
                return (
                  <div key={item} onClick={() => { toggleSelection(item, list, setList); salvarQuiz(); }} class={`p-4 rounded-2xl border flex justify-between items-center cursor-pointer ${isSelected ? 'bg-pink-500/20 border-pink-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                    <span class="font-medium text-sm">{item}</span>
                    <span class="material-icons text-sm">{isSelected ? 'favorite' : 'favorite_border'}</span>
                  </div>
                );
              })}
            </div>
          )}

          {/* ABA 6: CONEXÃO DO CASAL */}
          {aba === 'conexao' && (
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 text-center space-y-4">
              <span class="material-icons text-pink-500 text-5xl">favorite</span>
              <h2 class="text-xl font-bold text-white">Vincular Nosso Par</h2>
              <p class="text-xs text-slate-400">Digite um código único para vocês dois usarem juntos (ex: CASAL123)</p>

              <input type="text" placeholder="Ex: AMOR2026" value={codigoInput} onChange={e => setCodigoInput(e.target.value)} class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white text-center font-bold tracking-widest uppercase outline-none focus:border-pink-500" />

              <button onClick={vincular} disabled={loading} class="w-full bg-pink-500 p-3 rounded-xl font-bold text-white shadow-lg shadow-pink-500/20">
                {loading ? 'Conectando...' : 'Conectar Código'}
              </button>

              {dadosCasal && (
                <div class="mt-6 p-4 bg-slate-900 rounded-2xl text-left text-xs space-y-2 border border-slate-700">
                  <div class="text-pink-400 font-bold mb-1">Status da Sala:</div>
                  <div><b>Código:</b> {dadosCasal.codigo_casal}</div>
                  <div><b>Usuário 1:</b> {dadosCasal.user_1}</div>
                  <div><b>Usuário 2:</b> {dadosCasal.user_2 || 'Aguardando o parceiro...'}</div>
                </div>
              )}
            </div>
          )}

          {/* NAVBAR INFERIOR */}
          <div class="fixed bottom-0 left-0 right-0 bg-slate-800/90 backdrop-blur-md border-t border-slate-700 p-2 flex justify-around items-center z-40">
            {TABS.map(t => (
              <button key={t.id} onClick={() => setAba(t.id)} class={`flex flex-col items-center gap-1 p-2 rounded-xl transition ${aba === t.id ? 'text-pink-500' : 'text-slate-400'}`}>
                <span class="material-icons text-xl">{t.icon}</span>
                <span class="text-[10px] font-bold">{t.label}</span>
              </button>
            ))}
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
